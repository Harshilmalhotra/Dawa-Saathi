[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dawa-saathi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sqlalchemy>=2.0,<3", "alembic>=1.13", "pydantic>=2,<3", "pydantic-settings>=2.2", "httpx>=0.27,<1", "Pillow>=10", "rapidfuzz>=3.6", "apscheduler>=3.10,<4", "python-telegram-bot>=20,<23", "boto3>=1.34", "python-multipart>=0.0.9", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.3", "black>=24"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
